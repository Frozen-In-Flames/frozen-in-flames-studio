# CI for frozen-in-flames-studio.
# Test command from package.json scripts: "test": "vitest run",
# invoked as npm test. Dependencies install from the committed
# package-lock.json via npm ci.
# Added under the November 2026 audit follow-through.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
