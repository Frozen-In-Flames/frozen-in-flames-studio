# Deploy the Vite app to GitHub Pages on every push to main.
# Build type is the GitHub Actions workflow (configured through the
# Pages API), and the build runs with GITHUB_PAGES=1 so Vite emits
# asset paths under /frozen-in-flames-studio/.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
